[package]
name = "tvm-tirx-bindings"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned git dep (BLOCKERS C2 in tirx-kernels-dev): must stay in lockstep
# with the editable python tvm-ffi install, and downstream crates
# (cpusim-rs) must use the same source or cargo duplicates the crate.
tvm-ffi = { git = "https://github.com/apache/tvm-ffi.git", rev = "b98be1bf4062b85a95a7330327645ffd86f99b05" }

[lib]
name = "tvm_tirx_bindings"
path = "src/lib.rs"

[[bin]]
name = "tirx_demo"
path = "src/main.rs"
